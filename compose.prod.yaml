# Deploy stack: prebuilt images only, pinned by IMAGE_TAG (a commit SHA in CD, never "latest").
# Run: IMAGE_TAG=<sha> docker compose -f compose.prod.yaml up -d

name: civicpulse

networks:
  edge:
    driver: bridge
  internal:
    driver: bridge
    internal: true

volumes:
  pgdata:
  redisdata:
  ollama_models:

services:
  frontend:
    image: ghcr.io/abdullah-se-bit/civicpulse-frontend:${IMAGE_TAG:?set IMAGE_TAG}
    ports: ["8080:8080"]
    networks: [edge]
    depends_on:
      backend: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 128M }

  backend: # no published port and no source mount: only the frontend's /api proxy reaches it
    image: ghcr.io/abdullah-se-bit/civicpulse-backend:${IMAGE_TAG:?set IMAGE_TAG}
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      REDIS_URL: ${REDIS_URL:?set REDIS_URL in .env}
      TRIAGE_PROVIDER: ${TRIAGE_PROVIDER:-llm}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
    networks: [edge, internal]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "1.00", memory: 512M }

  postgres: # no published port
    image: postgres:16.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes: ["pgdata:/var/lib/postgresql/data"]
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "1.00", memory: 512M }

  redis: # no published port
    image: redis:7.4.1-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redisdata:/data"]
    networks: [internal]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 128M }

  ollama:
    image: ollama/ollama:0.5.7
    profiles: [ollama]
    volumes: ["ollama_models:/root/.ollama"]
    networks: [edge]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "2.00", memory: 3G }
