# Dev stack: builds from source. Run: cp .env.example .env && docker compose up --build
# Add the offline LLM with: docker compose --profile ollama up --build

name: civicpulse

networks:
  edge: # frontend <-> backend (and the backend's route to the internet for hosted LLMs)
    driver: bridge
  internal: # backend <-> database <-> cache; no route to the outside world
    driver: bridge
    internal: true

volumes:
  pgdata: # PostgreSQL data directory: the durable one
  redisdata: # Redis AOF, see docs/ENGINEERING-NOTES.md for why a cache gets a volume
  ollama_models: # model weights, so they are not re-pulled on every up

services:
  frontend:
    build: ./frontend
    ports: ["8080:8080"]
    networks: [edge] # never on internal: it must have no route to the database
    depends_on:
      backend: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 128M }

  backend:
    build: ./backend
    # Dev only: mount source and hot-reload. Wrong in prod, where the image must be the exact artifact CI built.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes: ["./backend/app:/app/app"]
    ports: ["8000:8000"] # dev only, so /ready, /metrics and Swagger are reachable and CI can probe /ready
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      REDIS_URL: ${REDIS_URL:?set REDIS_URL in .env}
      TRIAGE_PROVIDER: ${TRIAGE_PROVIDER:-simulated}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.groq.com/openai/v1}
      LLM_MODEL: ${LLM_MODEL:-llama-3.1-8b-instant}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
    networks: [edge, internal] # the only service bridging both
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "1.00", memory: 512M }

  postgres:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes: ["pgdata:/var/lib/postgresql/data"]
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "1.00", memory: 512M }

  redis:
    image: redis:7.4.1-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redisdata:/data"]
    networks: [internal]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 128M }

  ollama: # optional offline LLM path (TRIAGE_PROVIDER=ollama). On edge because it must download models.
    image: ollama/ollama:0.5.7
    profiles: [ollama]
    volumes: ["ollama_models:/root/.ollama"]
    networks: [edge]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "2.00", memory: 3G }
