name: evidence-ui

# Drives the real UI in headless Chromium against the Compose stack and uploads screenshots. Only evidence-ui/** pushes.
on:
  push:
    branches: ["evidence-ui/**"]

permissions:
  contents: read

jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TRIAGE_PROVIDER: rules # deterministic keyword triage, so the screenshots show sensible labels
    steps:
      - uses: actions/checkout@v4

      - name: Start the stack exactly as the quickstart does
        run: |
          cp .env.example .env
          docker compose up --build -d
          for i in $(seq 1 60); do curl -fsS http://localhost:8000/ready >/dev/null 2>&1 && break; sleep 2; done
          curl -fsS http://localhost:8080/ | grep -o '<title>[^<]*</title>'
          docker compose exec -T backend printenv TRIAGE_PROVIDER

      - name: Install Playwright and Chromium
        run: |
          mkdir /tmp/pw && cd /tmp/pw
          npm init -y >/dev/null
          npm i playwright >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Drive the UI and take screenshots
        run: |
          cp scripts/ui_screenshots.mjs /tmp/pw/
          cd /tmp/pw
          set -o pipefail
          BASE=http://localhost:8080 node ui_screenshots.mjs 2>&1 | tee ui-transcript.txt

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: |
            /tmp/pw/ui/
            /tmp/pw/ui-transcript.txt

      - if: failure()
        run: docker compose logs --no-color --tail=50 backend frontend
