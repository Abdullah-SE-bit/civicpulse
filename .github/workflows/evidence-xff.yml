name: evidence-xff

# Throwaway: reproduces the X-Forwarded-For rate-limit bypass on the checked-out code. Only pushes to evidence-xff/**.
on:
  push:
    branches: ["evidence-xff/**"]

permissions:
  contents: read

jobs:
  xff:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: |
          chmod +x scripts/evidence_xff.sh
          set -o pipefail
          scripts/evidence_xff.sh 2>&1 | tee xff.txt
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xff
          path: xff.txt
