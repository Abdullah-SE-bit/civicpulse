name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TRIAGE_PROVIDER: simulated # CI is deterministic: never call a real LLM

jobs:
  # ponytail: existence gates keep CI green while the backend / frontend / k8s work lands in separate PRs.
  # Delete this job and the `if:` lines once all three exist on dev.
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.f.outputs.backend }}
      frontend: ${{ steps.f.outputs.frontend }}
      k8s: ${{ steps.f.outputs.k8s }}
      stack: ${{ steps.f.outputs.stack }}
    steps:
      - uses: actions/checkout@v4
      - id: f
        run: |
          b=false; f=false; k=false
          [ -f backend/app/main.py ] && b=true
          [ -f frontend/package-lock.json ] && f=true
          [ -f k8s/overlays/prod/kustomization.yaml ] && k=true
          echo "backend=$b" >> "$GITHUB_OUTPUT"
          echo "frontend=$f" >> "$GITHUB_OUTPUT"
          echo "k8s=$k" >> "$GITHUB_OUTPUT"
          if [ $b = true ] && [ $f = true ]; then echo "stack=true" >> "$GITHUB_OUTPUT"; else echo "stack=false" >> "$GITHUB_OUTPUT"; fi

  lint-and-type:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - if: needs.changes.outputs.backend == 'true'
        uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/pyproject.toml }
      - if: needs.changes.outputs.backend == 'true'
        working-directory: backend
        run: |
          pip install -e ".[dev]"
          ruff check .
          mypy app
      - if: needs.changes.outputs.frontend == 'true'
        uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - if: needs.changes.outputs.frontend == 'true'
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npx tsc --noEmit

  test-backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/pyproject.toml }
      - working-directory: backend
        run: |
          pip install -e ".[dev]"
          pytest --cov=app --cov-fail-under=65

  test-frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - working-directory: frontend
        run: |
          npm ci
          npm test

  # Builds the image and scans it in the same job: a local image does not survive between jobs. Nothing is pushed.
  build:
    needs: [changes, lint-and-type, test-backend, test-frontend]
    if: ${{ !cancelled() && !failure() && (needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - id: present
        run: |
          [ "${{ needs.changes.outputs[matrix.image] }}" = "true" ] && echo "yes=true" >> "$GITHUB_OUTPUT" || echo "yes=false" >> "$GITHUB_OUTPUT"
      - if: steps.present.outputs.yes == 'true'
        uses: docker/setup-buildx-action@v3
      - if: steps.present.outputs.yes == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.image }}
          push: false # a PR must not publish artifacts
          load: true
          tags: civicpulse-${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      - if: steps.present.outputs.yes == 'true'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: civicpulse-${{ matrix.image }}:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true # only fail on findings that have a fix available
          exit-code: "1"

  manifests:
    needs: changes
    if: needs.changes.outputs.k8s == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          sudo mv kubeconform /usr/local/bin/
      - run: kubectl kustomize k8s/overlays/prod | kubeconform -strict -summary -ignore-missing-schemas -

  integration:
    needs: [changes, build]
    if: ${{ !cancelled() && !failure() && needs.changes.outputs.stack == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Create .env from the example (placeholders only)
        run: cp .env.example .env
      - run: docker compose up -d --build
      - run: scripts/integration.sh
      - if: failure()
        run: docker compose logs --no-color --tail=200
      - if: always()
        run: docker compose down -v
