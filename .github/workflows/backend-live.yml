name: backend-live

# Runs the backend suite against real PostgreSQL 16 and Redis 7 (service containers), which the SQLite/fakeredis
# tests in ci.yml cannot prove: migrations, DB constraints, timestamptz, Redis cache/limiter, SIGTERM drain.
on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: backend-live-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-services:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16.6-alpine
        env:
          POSTGRES_DB: civicpulse
          POSTGRES_USER: civicpulse
          POSTGRES_HOST_AUTH_METHOD: trust # throwaway CI container, no password to store
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U civicpulse -d civicpulse"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7.4.1-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      LIVE_DATABASE_URL: postgresql+psycopg://civicpulse@localhost:5432/civicpulse
      LIVE_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/pyproject.toml }
      - working-directory: backend
        run: |
          pip install -e ".[dev]"
          pytest tests/test_live_services.py -v -rs
