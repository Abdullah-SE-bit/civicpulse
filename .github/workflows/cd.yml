name: cd

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cd-main
  cancel-in-progress: false # never abort a deploy half way

env:
  TRIAGE_PROVIDER: simulated
  IMAGE_PREFIX: ghcr.io/abdullah-se-bit/civicpulse # GHCR names must be lowercase

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/pyproject.toml }
      - working-directory: backend
        run: |
          pip install -e ".[dev]"
          ruff check .
          mypy app
          pytest --cov=app --cov-fail-under=65
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - working-directory: frontend
        run: |
          npm ci
          npx tsc --noEmit
          npm test

  build-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # GITHUB_TOKEN scoped to this job: no account password, no long-lived token
    outputs:
      backend_digest: ${{ steps.backend.outputs.digest }}
      frontend_digest: ${{ steps.frontend.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-backend:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - id: frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-frontend:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      # SBOMs (Syft) are generated from the pushed, digest-addressed images and kept as workflow artifacts.
      - uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE_PREFIX }}-backend@${{ steps.backend.outputs.digest }}
          artifact-name: sbom-backend.spdx.json
      - uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE_PREFIX }}-frontend@${{ steps.frontend.outputs.digest }}
          artifact-name: sbom-frontend.spdx.json

  deploy-k8s:
    needs: build-push
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: read
    env:
      SHA: ${{ github.sha }} # deploy by commit SHA: "what is prod running?" has a one-word answer
    steps:
      - uses: actions/checkout@v4
      - uses: helm/kind-action@v1
        with:
          version: v0.24.0
          cluster_name: civicpulse
          config: scripts/kind-config.yaml

      - name: Install ingress-nginx and metrics-server
        run: |
          kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.11.3/deploy/static/provider/kind/deploy.yaml
          kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/download/v0.7.2/components.yaml
          kubectl -n kube-system patch deployment metrics-server --type=json \
            -p '[{"op":"add","path":"/spec/template/spec/containers/0/args/-","value":"--kubelet-insecure-tls"}]'
          kubectl -n ingress-nginx wait --for=condition=ready pod -l app.kubernetes.io/component=controller --timeout=180s

      - name: Load the exact images built for this SHA into kind
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          for img in backend frontend; do
            docker pull "$IMAGE_PREFIX-$img:$SHA"
            kind load docker-image "$IMAGE_PREFIX-$img:$SHA" --name civicpulse
          done

      - name: Create the Secret from GitHub Secrets (never from the repo)
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          pw=$(openssl rand -hex 16)
          echo "::add-mask::$pw"
          kubectl create namespace civicpulse --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n civicpulse create secret generic civicpulse-secrets \
            --from-literal=POSTGRES_PASSWORD="$pw" \
            --from-literal=DATABASE_URL="postgresql+psycopg://civicpulse:${pw}@postgres:5432/civicpulse" \
            --from-literal=LLM_API_KEY="${LLM_API_KEY:-}"

      - name: Apply overlays/prod pinned to the commit SHA
        run: |
          curl -sSL https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz | tar xz
          cd k8s/overlays/prod
          ../../../kustomize edit set image \
            "ghcr.io/abdullah-se-bit/civicpulse-backend=$IMAGE_PREFIX-backend:$SHA" \
            "ghcr.io/abdullah-se-bit/civicpulse-frontend=$IMAGE_PREFIX-frontend:$SHA"
          ../../../kustomize build . | kubectl apply -f -

      - name: Wait for rollout
        run: |
          kubectl -n civicpulse rollout status statefulset/postgres --timeout=180s
          kubectl -n civicpulse rollout status deployment/redis --timeout=120s
          kubectl -n civicpulse rollout status deployment/backend --timeout=240s
          kubectl -n civicpulse rollout status deployment/frontend --timeout=120s

      - name: Smoke test through the Ingress
        run: |
          base=http://civicpulse.localtest.me
          curl -fsS --retry 15 --retry-delay 4 --retry-connrefused --resolve civicpulse.localtest.me:80:127.0.0.1 "$base/" >/dev/null
          id=$(curl -fsS --resolve civicpulse.localtest.me:80:127.0.0.1 -X POST "$base/api/complaints" \
            -H 'Content-Type: application/json' \
            -d '{"text":"Streetlight out on Main Road for three nights","location":"Main Road"}' | jq -er .id)
          curl -fsS --resolve civicpulse.localtest.me:80:127.0.0.1 "$base/api/complaints/$id" | jq -e .category

      - name: What is running
        if: always()
        run: |
          kubectl -n civicpulse get deploy,statefulset,pods -o wide
          kubectl -n civicpulse get hpa
