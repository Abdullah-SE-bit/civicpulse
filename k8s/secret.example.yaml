# PLACEHOLDERS ONLY. Never commit real values. Create the real Secret out of band, e.g.:
#   kubectl -n civicpulse create secret generic civicpulse-secrets \
#     --from-literal=POSTGRES_PASSWORD=... --from-literal=DATABASE_URL=... --from-literal=LLM_API_KEY=...
# (CD does exactly this from GitHub Secrets.) For a throwaway local cluster you may apply this file as is.
apiVersion: v1
kind: Secret
metadata:
  name: civicpulse-secrets
  namespace: civicpulse
type: Opaque
stringData:
  POSTGRES_PASSWORD: change-me
  DATABASE_URL: postgresql+psycopg://civicpulse:change-me@postgres:5432/civicpulse
  LLM_API_KEY: ""
