apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: [../../base]
# Deployed by immutable reference: CD (and rollback) run `kustomize edit set image ...:<commit sha>`.
# The value below is a marker so a plain apply of this file can never silently deploy ":latest".
images:
  - { name: ghcr.io/abdullah-se-bit/civicpulse-backend, newTag: set-by-cd }
  - { name: ghcr.io/abdullah-se-bit/civicpulse-frontend, newTag: set-by-cd }
