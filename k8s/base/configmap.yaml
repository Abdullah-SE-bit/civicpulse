apiVersion: v1
kind: ConfigMap
metadata:
  name: civicpulse-config
data:
  POSTGRES_DB: civicpulse
  POSTGRES_USER: civicpulse
  REDIS_URL: redis://redis:6379/0
  # "rules" works with no key. "llm" needs LLM_API_KEY in the Secret (factory.py refuses to start without it) and
  # then falls back to rules on failure. Do not add empty-string keys here: an empty value overrides the code default.
  TRIAGE_PROVIDER: rules
