apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: civicpulse
resources:
  - namespace.yaml
  - configmap.yaml
  - postgres.yaml
  - redis.yaml
  - backend.yaml
  - frontend.yaml
  - ingress.yaml
# The Secret is deliberately NOT here: applying an overlay must never overwrite a real secret with placeholders.
# See k8s/secret.example.yaml.
